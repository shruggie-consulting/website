document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n-items: start;\">\n      <div>\n        <div style=\"font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--rust); margin-bottom: 24px;\">{{ t.contactEyebrow }}<\u002Fdiv>\n        <h2 style=\"font: 400 clamp(30px, 6vw, 48px)/1.1 var(--font-display); letter-spacing: -0.02em; text-transform: uppercase; margin: 0 0 32px; text-wrap: pretty;\">{{ t.contactTitle }}<\u002Fh2>\n        <p style=\"font: 400 18px/1.7 var(--font-sans); color: oklch(0.85 0 0); margin: 0; max-width: 55ch; text-wrap: pretty;\">{{ t.contactBody }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid oklch(0.3 0 0);\">\n        <sc-for list=\"{{ contactRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n          <div style=\"padding: 24px 0; border-bottom: 1px solid oklch(0.3 0 0);\">\n            <div style=\"font: 700 13px var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--rust); margin-bottom: 10px;\">{{ row.label }}<\u002Fdiv>\n            <div style=\"font: 700 20px var(--font-sans);\">{{ row.value }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background: var(--bg); padding: 40px clamp(20px, 5vw, 48px);\">\n    <div style=\"max-width: 1200px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 16px; margin-bottom: 16px;\">\n        <span style=\"font-family: var(--font-display); font-size: 18px; letter-spacing: -0.02em; text-transform: uppercase;\">Shruggie<span style=\"color: var(--rust);\">.<\u002Fspan><\u002Fspan>\n        <span style=\"width: 24px; height: 2px; background: var(--rust); display: inline-block;\"><\u002Fspan>\n        <span style=\"font-size: 12px; letter-spacing: 0.18em; color: var(--ink-soft);\">CONSULTING<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font: 400 13px var(--font-sans); color: var(--ink-soft); margin: 0;\">{{ t.footerNote }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst COPY = {\n  en: {\n    bookCall: 'BOOK A CALL',\n    heroEyebrow: 'CLIENT SERVICE & ACCOUNT LEADERSHIP',\n    heroTitle: \"GREAT WORK ISN'T ENOUGH. THE CLIENT HAS TO FEEL HELD.\",\n    heroBody: \"I help small and mid-size agencies run client service properly — account leads who own the relationship, meetings clients look forward to, and no surprises before a renewal. Commercials come after the service is solid.\",\n    heroBtn1: 'BOOK A 30-MIN CALL',\n    heroBtn2: 'SEE THE SERVICES',\n    aboutEyebrow: 'ABOUT ME',\n    aboutTitle: \"I'VE BEEN THE PERSON THE CLIENT CALLS AT 7PM\",\n    aboutP1: \"I spent fifteen years inside independent agencies — account manager, account director, then head of client services in a 60-person shop. I ran the QBRs, handled the escalations, and rebuilt more than one relationship that had quietly gone cold.\",\n    aboutP2: \"What I saw, repeatedly: accounts lost despite strong work. Not because the creative failed — because nobody was clearly running the relationship. Status calls with no point of view, feedback absorbed rather than shaped, and a sponsor who no longer knew what they were getting.\",\n    aboutP3: \"Client service is a craft, and it can be taught. I help your account leads get good at it — then, once that's steady, we look at the commercials underneath it.\",\n    servicesEyebrow: 'SERVICES',\n    servicesTitle: 'THREE THINGS I GET ASKED FOR',\n    servicesBody: 'Client service first, commercials once the relationship is steady. Most engagements start with one and pull in a second.',\n    approachEyebrow: 'APPROACH',\n    approachTitle: 'SIT IN, FIX ONE THING, HAND IT OVER',\n    quote: 'OUR CLIENTS STOPPED FEELING LIKE THEY HAD TO CHASE US.',\n    quoteAuthor: 'Managing Director, 45-person independent agency',\n    quoteNote: 'Illustrative client comment',\n    engagementsEyebrow: 'ENGAGEMENTS',\n    engagementsTitle: 'THREE WAYS TO WORK TOGETHER',\n    engagementsBody: 'Sample structures. Final scope and fee are agreed before anything starts — no hourly surprises.',\n    contactEyebrow: 'CONTACT',\n    contactTitle: 'LET US GET IN TOUCH',\n    contactBody: \"Thirty minutes, no deck. We'll talk about what keeps you awake at night and discuss how we can figure it out. :)\",\n    footerNote: '© 2026 Shruggie Consulting · Client service & account leadership · Figures on this site are illustrative',\n    stats: [\n      { value: '15 yrs', caption: 'Agency-side, account director to head of client services', color: 'var(--ink)' },\n      { value: '100+', caption: 'Client service professionals led and nurtured', color: 'var(--rust)' },\n      { value: '2/qtr', caption: 'New engagements taken on per quarter, to leave room for consulting', color: 'var(--ink)' },\n      { value: '10–80', caption: 'Headcount range I work best with', color: 'var(--ink)' },\n    ],\n    aboutRows: [\n      { label: 'Based in', value: 'Munich 🥨, working across EMEA 🌍' },\n      { label: 'Best fit', value: 'Client service challenges, looking under the hood of independent agencies' },\n      { label: 'Not a fit', value: '\"100 leads in two minutes\" theatre, headcount cuts, rebrands' },\n    ],\n    services: [\n      { num: '01', title: 'ACCOUNT LEADERSHIP', body: 'Define what an account lead actually owns, and give them the operating rhythm to do it: weekly cadence, a point of view in every meeting, and a clear line between servicing a client and being managed by one.', tags: 'ROLE DEFINITION · MEETING CADENCE · OWNERSHIP MAP', border: 'var(--rust)' },\n      { num: '02', title: 'CLIENT COMMUNICATION', body: 'The conversations teams avoid: presenting work with conviction, shaping feedback instead of collecting it, delivering bad news early, and saying no without damaging the relationship. Practised on live accounts, not in role-play.', tags: 'SCRIPTS · CALL SHADOWING · FEEDBACK FRAMEWORK', border: 'var(--line)' },\n      { num: '03', title: 'CLIENT HEALTH & RENEWALS', body: \"A simple scorecard across your accounts — sentiment, sponsor stability, engagement quality — so renewal risk shows up two quarters early instead of in the cancellation email. Plus a QBR format clients don't dread.\", tags: 'ACCOUNT SCORECARD · QBR FORMAT · ESCALATION PATH', border: 'var(--line)' },\n    ],\n    approachSteps: [\n      { range: 'WEEKS 1–2', title: 'SIT IN ON THE ACCOUNTS', body: 'I sit in on your status calls and one QBR, read the last six months of client threads, and talk to three account leads and, where you allow it, two clients.' },\n      { range: 'WEEKS 3–6', title: 'FIX THE ONE THING', body: 'We pick the single change the accounts will feel first — usually how meetings are run or who owns the relationship — and build it properly rather than reforming everything at once.' },\n      { range: 'WEEKS 7–8', title: 'HAND IT OVER', body: \"Playbook, a two-hour session with the account team, and a 90-day check-in. If you need me after that, something didn't land.\" },\n    ],\n    plans: [\n      { title: 'DIAGNOSTIC', price: '€6k', priceUnit: 'fixed', bg: 'var(--cream)', fg: 'var(--ink)', border: '1px solid var(--line)', items: ['Two weeks, part-time', 'Status calls and one QBR observed live', 'Findings memo + prioritised fix list', 'One 90-minute readout with leadership'] },\n      { title: 'FIX & HAND OVER', price: '€18k', priceUnit: '/ 8 wks', bg: 'var(--rust)', fg: 'var(--cream)', border: 'none', items: ['Everything in the diagnostic', 'One system rebuilt properly (account ownership, meeting rhythm, or health scorecard)', 'Client service playbook your team owns', 'Session with the account team + 90-day check-in'] },\n      { title: 'ADVISORY RETAINER', price: '€3.5k', priceUnit: '/mo', bg: 'var(--cream)', fg: 'var(--ink)', border: '1px solid var(--line)', items: ['Two half-days a month', 'On call for escalations and difficult client calls', 'Quarterly account health review', 'Three-month minimum, cancel with 30 days'] },\n    ],\n    contactRows: [\n      { label: 'EMAIL', value: 'hello@shruggie.consulting' },\n      { label: 'CALLS', value: 'Book a 30-min slot' },\n      { label: 'AVAILABILITY', value: 'Two new engagements per quarter' },\n    ],\n  },\n  de: {\n    bookCall: 'TERMIN BUCHEN',\n    heroEyebrow: 'CLIENT SERVICE & KUNDENFÜHRUNG',\n    heroTitle: 'GUTE ARBEIT REICHT NICHT. DER KUNDE MUSS SICH GEFÜHRT FÜHLEN.',\n    heroBody: 'Ich helfe kleinen und mittelgroßen Agenturen, Client Service sauber aufzustellen — Account-Leads, die die Beziehung wirklich führen, Meetings, auf die Kunden sich freuen, und keine Überraschungen vor der Verlängerung. Die Kommerzseite kommt danach.',\n    heroBtn1: '30-MIN-TERMIN BUCHEN',\n    heroBtn2: 'LEISTUNGEN ANSEHEN',\n    aboutEyebrow: 'ÜBER MICH',\n    aboutTitle: 'ICH WAR DIE PERSON, DIE DER KUNDE UM 19 UHR ANRUFT',\n    aboutP1: 'Fünfzehn Jahre in unabhängigen Agenturen — Account Manager, Account Director, dann Head of Client Services in einer Agentur mit 60 Leuten. Ich habe die QBRs geführt, Eskalationen übernommen und mehr als eine Beziehung wieder aufgebaut, die still eingeschlafen war.',\n    aboutP2: 'Was ich immer wieder gesehen habe: Kunden gehen verloren, obwohl die Arbeit stark ist. Nicht weil die Kreation scheitert — sondern weil niemand die Beziehung sichtbar führt. Status-Calls ohne Haltung, Feedback wird eingesammelt statt eingeordnet, und der Ansprechpartner weiß irgendwann nicht mehr, was er eigentlich bekommt.',\n    aboutP3: 'Client Service ist ein Handwerk, und es ist lernbar. Ich bringe Ihre Account-Leads darin weiter — und wenn das stabil läuft, schauen wir auf die Kommerzseite darunter.',\n    servicesEyebrow: 'LEISTUNGEN',\n    servicesTitle: 'DREI DINGE, NACH DENEN GEFRAGT WIRD',\n    servicesBody: 'Client Service zuerst, Kommerzielles, wenn die Beziehung stabil ist. Meist beginnt es mit einem Thema und zieht ein zweites nach.',\n    approachEyebrow: 'VORGEHEN',\n    approachTitle: 'MITLAUFEN, EINE SACHE LÖSEN, ÜBERGEBEN',\n    quote: 'UNSERE KUNDEN HABEN AUFGEHÖRT, UNS HINTERHERLAUFEN ZU MÜSSEN.',\n    quoteAuthor: 'Geschäftsführer, unabhängige Agentur mit 45 Personen',\n    quoteNote: 'Beispielhafte Kundenstimme',\n    engagementsEyebrow: 'ZUSAMMENARBEIT',\n    engagementsTitle: 'DREI WEGE, ZUSAMMENZUARBEITEN',\n    engagementsBody: 'Beispielhafte Zuschnitte. Umfang und Honorar werden vor dem Start festgelegt — keine Überraschungen nach Stunden.',\n    contactEyebrow: 'KONTAKT',\n    contactTitle: 'LASSEN SIE UNS IN KONTAKT TRETEN',\n    contactBody: 'Dreißig Minuten, ohne Deck. Wir sprechen darüber, was Sie nachts wachhält, und schauen gemeinsam, wie wir es lösen können. :)',\n    footerNote: '© 2026 Shruggie Consulting · Client Service & Kundenführung · Zahlen auf dieser Seite sind beispielhaft',\n    stats: [\n      { value: '15 J.', caption: 'Agenturseite, vom Account Director zum Head of Client Services', color: 'var(--ink)' },\n      { value: '100+', caption: 'Geführte und entwickelte Client-Service-Fachkräfte', color: 'var(--rust)' },\n      { value: '2/Q.', caption: 'Neue Mandate pro Quartal, um Raum für Beratung zu lassen', color: 'var(--ink)' },\n      { value: '10–80', caption: 'Teamgröße, mit der ich am besten arbeite', color: 'var(--ink)' },\n    ],\n    aboutRows: [\n      { label: 'Standort', value: 'München 🥨, tätig in der EMEA-Region 🌍' },\n      { label: 'Passt gut', value: 'Herausforderungen im Client Service, ein Blick unter die Haube unabhängiger Agenturen' },\n      { label: 'Passt nicht', value: '„100 Leads in zwei Minuten\"-Theater, Pitches, Rebrandings' },\n    ],\n    services: [\n      { num: '01', title: 'KUNDENFÜHRUNG', body: 'Klären, was ein Account-Lead tatsächlich verantwortet, und den Arbeitsrhythmus dafür geben: fester Wochentakt, eine Haltung in jedem Meeting und eine klare Grenze zwischen Kunden betreuen und von Kunden gesteuert werden.', tags: 'ROLLENBILD · MEETING-TAKT · VERANTWORTUNGSKARTE', border: 'var(--rust)' },\n      { num: '02', title: 'KUNDENKOMMUNIKATION', body: 'Die Gespräche, die Teams meiden: Arbeit mit Überzeugung präsentieren, Feedback einordnen statt sammeln, schlechte Nachrichten früh liefern und Nein sagen, ohne die Beziehung zu beschädigen. Geübt an echten Kunden, nicht im Rollenspiel.', tags: 'GESPRÄCHSLEITFÄDEN · CALL-BEGLEITUNG · FEEDBACK-MODELL', border: 'var(--line)' },\n      { num: '03', title: 'KUNDENGESUNDHEIT & VERLÄNGERUNGEN', body: 'Ein einfaches Scorecard-Modell über alle Kunden — Stimmung, Stabilität des Ansprechpartners, Qualität der Zusammenarbeit — damit Verlängerungsrisiko zwei Quartale früher sichtbar wird und nicht erst in der Kündigungsmail. Dazu ein QBR-Format, das Kunden nicht fürchten.', tags: 'ACCOUNT-SCORECARD · QBR-FORMAT · ESKALATIONSWEG', border: 'var(--line)' },\n    ],\n    approachSteps: [\n      { range: 'WOCHE 1–2', title: 'BEI DEN KUNDEN MITLAUFEN', body: 'Ich sitze in Ihren Status-Calls und einem QBR, lese die Kundenkorrespondenz der letzten sechs Monate und spreche mit drei Account-Leads und, wenn Sie es zulassen, zwei Kunden.' },\n      { range: 'WOCHE 3–6', title: 'DIE EINE SACHE LÖSEN', body: 'Wir wählen die Änderung, die die Kunden zuerst spüren — meist wie Meetings geführt werden oder wer die Beziehung verantwortet — und bauen sie richtig, statt alles gleichzeitig umzustellen.' },\n      { range: 'WOCHE 7–8', title: 'ÜBERGEBEN', body: 'Playbook, eine zweistündige Session mit dem Account-Team und ein Check-in nach 90 Tagen. Wenn Sie mich danach brauchen, hat etwas nicht gehalten.' },\n    ],\n    plans: [\n      { title: 'DIAGNOSE', price: '6.000 €', priceUnit: 'fix', bg: 'var(--cream)', fg: 'var(--ink)', border: '1px solid var(--line)', items: ['Zwei Wochen, in Teilzeit', 'Status-Calls und ein QBR live begleitet', 'Befundmemo + priorisierte Maßnahmenliste', 'Ein 90-minütiges Readout mit der Führung'] },\n      { title: 'LÖSEN & ÜBERGEBEN', price: '18.000 €', priceUnit: '/ 8 Wo.', bg: 'var(--rust)', fg: 'var(--cream)', border: 'none', items: ['Alles aus der Diagnose', 'Ein System richtig aufgebaut (Verantwortung, Meeting-Takt oder Scorecard)', 'Client-Service-Playbook, das Ihr Team besitzt', 'Session mit dem Account-Team + Check-in nach 90 Tagen'] },\n      { title: 'BERATUNGS-RETAINER', price: '3.500 €', priceUnit: '/Mon.', bg: 'var(--cream)', fg: 'var(--ink)', border: '1px solid var(--line)', items: ['Zwei halbe Tage pro Monat', 'Erreichbar für Eskalationen und schwierige Kundencalls', 'Quartalsweiser Kundengesundheits-Review', 'Drei Monate Mindestlaufzeit, 30 Tage Kündigungsfrist'] },\n    ],\n    contactRows: [\n      { label: 'E-MAIL', value: 'hello@shruggie.consulting' },\n      { label: 'TERMINE', value: '30-Min-Slot buchen' },\n      { label: 'KAPAZITÄT', value: 'Zwei neue Mandate pro Quartal' },\n    ],\n  },\n};\n\nclass Component extends DCLogic {\n  state = { lang: 'en' };\n  renderVals() {\n    const lang = this.state.lang;\n    const t = COPY[lang];\n    const navLabels = lang === 'de'\n      ? [['#about','\\u00dcber mich'],['#services','Leistungen'],['#approach','Vorgehen'],['#engagements','Zusammenarbeit'],['#contact','Kontakt']]\n      : [['#about','About'],['#services','Services'],['#approach','Approach'],['#engagements','Engagements'],['#contact','Contact']];\n    return {\n      t,\n      navLinks: navLabels.map(([href, label]) => ({ href, label })),\n      stats: t.stats,\n      aboutRows: t.aboutRows,\n      services: t.services,\n      approachSteps: t.approachSteps,\n      plans: t.plans,\n      contactRows: t.contactRows,\n      enBg: lang === 'en' ? 'var(--rust)' : 'transparent',\n      enColor: lang === 'en' ? 'var(--cream)' : 'oklch(0.7 0 0)',\n      deBg: lang === 'de' ? 'var(--rust)' : 'transparent',\n      deColor: lang === 'de' ? 'var(--cream)' : 'oklch(0.7 0 0)',\n      setLang_en: () => this.setState({ lang: 'en' }),\n      setLang_de: () => this.setState({ lang: 'de' }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
