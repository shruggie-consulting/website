<title>Stundensatz-Anatomie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Interaktive Aufschlüsselung eines Stundensatzes: Gehalt, Lohnnebenkosten, Marge und schaltbare, oft vergessene Kostenposten.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: brand · redesign: full
 * paper: oklch(100% 0 0) · accent: oklch(50% 0.2 25) · display: Archivo Black · body: Space Grotesk
 * nav: kept, a wordmark and the language switch · signature: the rate bar that grows as ledger rows switch on · states: full (no data loads)
 * axes: white/grotesque-black/red · posture: tool · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R4 V3 · weakest: V, the brand fixes palette and faces; variety comes from the ledger replacing the card grid */
/* Hallmark · waive 39b · button.card is a full-width ledger row holding a name, an explanation and two figures · the row is the switch target, so it is as tall as its text, not a 40px button; button.info is a 24px inline help icon beside a term, kept small so it reads as a footnote mark */
:root {
  --color-paper: oklch(100% 0 0);
  --color-paper-2: oklch(96.5% 0 0);
  --color-paper-3: oklch(92% 0 0);
  --color-ink: oklch(20% 0 0);
  --color-ink-2: oklch(38% 0 0);
  --color-muted: oklch(46% 0 0);
  --color-rule: oklch(87% 0 0);
  --color-edge: oklch(58% 0 0);
  --color-accent: oklch(50% 0.2 25);
  --color-accent-text: oklch(48% 0.2 25);
  --color-accent-ink: oklch(100% 0 0);
  --color-signal: oklch(82% 0.19 100);
  --color-on-signal: oklch(20% 0 0);
  --color-good: oklch(70% 0.19 150);
  --color-on-good: oklch(20% 0 0);
  --color-focus: oklch(20% 0 0);
  --seg-salary: oklch(20% 0 0);
  --seg-social: oklch(47% 0 0);
  --seg-work: oklch(40% 0.16 25);
  --seg-people: oklch(56% 0.2 25);
  --seg-org: oklch(72% 0.12 25);
  --seg-risk: oklch(86% 0.06 25);
  --seg-margin: oklch(70% 0.19 150);
  --font-body: "Space Grotesk", Helvetica, Arial, sans-serif;
  --font-display: "Archivo Black", "Space Grotesk", Helvetica, Arial, sans-serif;
  --text-xs: 13px; --text-sm: 14px; --text-md: 16px; --text-lg: 20px; --text-xl: 24px; --text-2xl: 32px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px; --space-16: 64px; --space-20: 80px;
  --container: 1080px;
  --radius: 2px; --radius-pill: 999px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms; --dur-bar: 700ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-paper: oklch(19% 0 0); --color-paper-2: oklch(23.5% 0 0); --color-paper-3: oklch(29% 0 0);
    --color-ink: oklch(97% 0 0); --color-ink-2: oklch(87% 0 0); --color-muted: oklch(73% 0 0); --color-rule: oklch(34% 0 0); --color-edge: oklch(62% 0 0);
    --color-accent: oklch(58% 0.2 25); --color-accent-text: oklch(73% 0.16 25); --color-focus: oklch(97% 0 0);
    --seg-salary: oklch(97% 0 0); --seg-social: oklch(70% 0 0); --seg-work: oklch(46% 0.18 25);
    --seg-people: oklch(60% 0.2 25); --seg-org: oklch(75% 0.12 25); --seg-risk: oklch(88% 0.06 25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --color-paper: oklch(19% 0 0); --color-paper-2: oklch(23.5% 0 0); --color-paper-3: oklch(29% 0 0);
  --color-ink: oklch(97% 0 0); --color-ink-2: oklch(87% 0 0); --color-muted: oklch(73% 0 0); --color-rule: oklch(34% 0 0); --color-edge: oklch(62% 0 0);
  --color-accent: oklch(58% 0.2 25); --color-accent-text: oklch(73% 0.16 25); --color-focus: oklch(97% 0 0);
  --seg-salary: oklch(97% 0 0); --seg-social: oklch(70% 0 0); --seg-work: oklch(46% 0.18 25);
  --seg-people: oklch(60% 0.2 25); --seg-org: oklch(75% 0.12 25); --seg-risk: oklch(88% 0.06 25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scrollbar-color: var(--color-muted) var(--color-paper); }
::selection { background: var(--color-signal); color: var(--color-on-signal); }
body {
  background: var(--color-paper); color: var(--color-ink);
  font-family: var(--font-body); font-size: var(--text-md); line-height: 1.5;
  padding-left: max(var(--space-4), env(safe-area-inset-left, 0px));
  padding-right: max(var(--space-4), env(safe-area-inset-right, 0px));
  padding-block: 0 200px;
  -webkit-font-smoothing: antialiased; caret-color: var(--color-accent);
}
.wrap { max-width: var(--container); margin-inline: auto; display: flex; flex-direction: column; gap: var(--space-20); }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.015em; line-height: 1.1; text-wrap: balance; overflow-wrap: break-word; min-width: 0; color: var(--color-ink); }
h1 { font-size: var(--text-2xl); max-width: 22ch; }
h2 { font-size: var(--text-xl); max-width: 32ch; }
h3 { font-size: var(--text-md); font-weight: 700; line-height: 1.3; color: var(--color-ink); }
p { text-wrap: pretty; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, input:disabled { opacity: 0.55; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* shell */
.top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); min-height: 64px; border-bottom: 1px solid var(--color-rule); }
.brand { display: flex; align-items: baseline; gap: var(--space-3); font-family: var(--font-display); font-size: var(--text-lg); letter-spacing: -0.01em; }
.brand span { font-family: var(--font-body); font-size: var(--text-sm); letter-spacing: 0; color: var(--color-muted); white-space: nowrap; }
.lang { display: flex; gap: var(--space-1); }
.lang button { display: flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-3); background: none; border: 1px solid transparent; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); transition: color var(--dur-micro), border-color var(--dur-micro); }
.lang button:hover { color: var(--color-ink); }
.lang button[aria-pressed="true"] { border-color: var(--color-ink); color: var(--color-ink); }
.lang svg { width: 18px; height: 12px; border-radius: 1px; display: block; }

.intro { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--space-8) var(--space-16); align-items: start; margin-top: calc(var(--space-10) * -1); padding-bottom: var(--space-10); border-bottom: 1px solid var(--color-rule); }
.intro-text { display: flex; flex-direction: column; gap: var(--space-4); }
.intro-text p { color: var(--color-ink-2); }
.howto { display: flex; flex-direction: column; gap: var(--space-3); }
.howto h2 { font-family: var(--font-body); font-size: var(--text-md); font-weight: 700; letter-spacing: 0; line-height: 1.3; }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: step; display: flex; flex-direction: column; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: var(--space-2); padding-block: var(--space-2); border-top: 1px solid var(--color-rule); font-size: var(--text-sm); color: var(--color-ink-2); }
.steps li::before { content: counter(step); font-weight: 700; color: var(--color-ink); font-variant-numeric: tabular-nums; }

/* calculator */
.calc { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: var(--space-16); align-items: start; }
#step1 { margin-top: calc(var(--space-10) * -1); }
.step-head { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.step-no { display: grid; place-items: center; width: 40px; height: 40px; border-radius: var(--radius); background: var(--color-ink); color: var(--color-paper); font-family: var(--font-display); font-size: var(--text-lg); line-height: 1; }
.notice { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-3) var(--space-4); align-items: center; padding: var(--space-3) var(--space-4); background: var(--color-paper-2); color: var(--color-ink); border-radius: var(--radius); }
.notice p { font-size: var(--text-sm); color: var(--color-ink-2); }
.notice b { color: var(--color-ink); }
.btn.primary { background: var(--color-ink); color: var(--color-paper); white-space: nowrap; }
.btn.primary:hover { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-accent-ink); }
.ghost { position: absolute; inset: 0; background-image: repeating-linear-gradient(135deg, var(--color-edge) 0 2px, transparent 2px 8px); clip-path: inset(0 100% 0 0); transition: clip-path var(--dur-bar) var(--ease-out), opacity var(--dur-short); }
.ghost-say, .howto .hint { margin-top: var(--space-2); font-size: var(--text-xs); color: var(--color-muted); line-height: 1.4; }
.inputs { display: flex; flex-direction: column; gap: var(--space-6); }
.field { display: flex; flex-direction: column; gap: var(--space-2); }
.field-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); min-height: 32px; }
.field label { font-weight: 500; }
.field .hint { font-size: var(--text-xs); color: var(--color-muted); line-height: 1.4; min-height: 1lh; }
.valbox { display: flex; align-items: center; gap: var(--space-1); font-weight: 700; }
.valbox input { width: 5.4em; height: 32px; text-align: right; background: var(--color-paper); color: var(--color-ink); border: 1px solid var(--color-edge); border-radius: var(--radius); padding: 0 var(--space-2); font-weight: 700; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.valbox input::-webkit-outer-spin-button, .valbox input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.valbox input:focus-visible, .guess-row input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -2px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; cursor: pointer; margin: 0; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--color-ink) var(--fill, 50%), var(--color-edge) var(--fill, 50%)); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--color-edge); }
input[type="range"]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--color-ink); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; margin-top: calc(var(--space-2) * -1); border-radius: 50%; background: var(--color-paper); border: 2px solid var(--color-ink); transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--color-paper); border: 2px solid var(--color-ink); }
input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.15); background: var(--color-signal); }

.result { display: flex; flex-direction: column; gap: var(--space-6); min-width: 0; }
.rate-row { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-4) var(--space-8); }
.rate-main { display: flex; flex-direction: column; gap: var(--space-1); }
.rate-label { font-size: var(--text-sm); color: var(--color-muted); }
.rate-line { display: flex; align-items: baseline; gap: var(--space-3); }
.rate { font-family: var(--font-display); font-size: 72px; line-height: 1; letter-spacing: -0.03em; }
.delta { font-weight: 700; font-size: var(--text-sm); padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill); background: var(--color-signal); color: var(--color-on-signal); opacity: 0; white-space: nowrap; }
.delta.neg { background: var(--color-paper-3); color: var(--color-ink); }
.delta.show { animation: pop 1.8s var(--ease-out) forwards; }
@keyframes pop { 0% { opacity: 0; transform: translateY(8px) scale(0.9); } 12% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-6px); } }
.facts { display: flex; gap: var(--space-8); margin: 0; padding-bottom: var(--space-2); }
.fact { display: flex; flex-direction: column-reverse; }
.fact b { font-size: var(--text-lg); font-weight: 700; line-height: 1.3; }
.fact > span { font-size: var(--text-xs); color: var(--color-muted); white-space: nowrap; }

.bar-head h2 { font-family: var(--font-body); font-size: var(--text-md); font-weight: 700; letter-spacing: 0; line-height: 1.3; }
.bar-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.seg-toggle { display: flex; border: 1px solid var(--color-edge); border-radius: var(--radius-pill); padding: 2px; }
.seg-toggle button { height: 32px; background: none; border: 0; border-radius: var(--radius-pill); padding: 0 var(--space-4); font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); transition: background-color var(--dur-micro), color var(--dur-micro); }
.seg-toggle button:hover { color: var(--color-ink); }
.seg-toggle button[aria-pressed="true"] { background: var(--color-ink); color: var(--color-paper); }

.chart { position: relative; padding-top: 56px; }
.track { position: relative; height: 64px; background-color: var(--color-paper-2); border-radius: var(--radius); background-image: linear-gradient(to right, var(--color-rule) 1px, transparent 1px); background-size: 25% 100%; }
.bar { position: absolute; inset: 0; display: flex; transform-origin: left center; transform: scaleX(0); transition: transform var(--dur-bar) var(--ease-out); }
.seg { flex: 0 0 0; min-width: 0; background: var(--c); transition: flex-grow var(--dur-bar) var(--ease-out); box-shadow: inset -2px 0 0 var(--color-paper); }
.seg:last-child { box-shadow: none; }
.seg.flash { animation: flash 0.9s var(--ease-out); }
@keyframes flash { 0% { filter: brightness(1.5) saturate(1.3); } 100% { filter: none; } }
.marks { position: absolute; inset: -56px 0 -4px 0; overflow: clip; pointer-events: none; }
.marker { position: absolute; inset: 0; transition: transform var(--dur-bar) var(--ease-out), opacity var(--dur-short); pointer-events: none; }
.marker i { position: absolute; top: 24px; bottom: 0; right: -1px; border-left: 2px dashed var(--color-ink); }
.marker span { position: absolute; top: 0; right: 0; font-size: var(--text-xs); font-weight: 500; white-space: nowrap; line-height: 1.4; padding: 2px var(--space-2); border-radius: var(--radius); transform: translateX(50%); }
.marker.naive span { background: var(--color-paper-3); color: var(--color-ink); right: auto; left: 100%; transform: translateX(-12px); top: 28px; }
.marker.naive i { top: 52px; border-left-style: solid; border-left-color: var(--color-muted); }
.marker.guess span { background: var(--color-ink); color: var(--color-paper); }
.marker.guess.right span { transform: translateX(12px); }
.axis { display: flex; justify-content: space-between; font-size: var(--text-xs); color: var(--color-muted); margin-top: var(--space-2); }

.legend { display: flex; flex-direction: column; border-top: 1px solid var(--color-ink); }
.lg { display: grid; grid-template-columns: 12px minmax(0, 1fr) 6em 4em; gap: var(--space-3); align-items: center; min-height: 40px; border-bottom: 1px solid var(--color-rule); font-size: var(--text-sm); transition: opacity var(--dur-short); }
.lg i { width: 12px; height: 12px; border-radius: 1px; background: var(--c); }
.lg b { font-weight: 700; text-align: right; }
.lg em { font-style: normal; color: var(--color-muted); text-align: right; }
.lg.off { opacity: 0.45; }

/* existing rate */
.chip { display: inline-flex; align-items: center; min-height: 24px; padding: 0 var(--space-2); border-radius: var(--radius); font-size: var(--text-xs); font-weight: 700; white-space: nowrap; }
.chip.ok { background: var(--color-good); color: var(--color-on-good); }
.field.locked label, .field.locked .valbox, .field.locked input[type="range"] { opacity: 0.55; cursor: not-allowed; }
.lg.neg b { color: var(--color-accent-text); }
.chip.mid { background: var(--color-signal); color: var(--color-on-signal); }
.chip.bad { background: var(--color-accent); color: var(--color-accent-ink); }
.cmp { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); font-size: var(--text-sm); color: var(--color-ink-2); margin-top: calc(var(--space-3) * -1); }
.cmp b, .verdict b { color: var(--color-ink); }
.dock-cmp { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-2); margin: 0; font-size: var(--text-xs); font-weight: 700; color: var(--color-ink); }
.verdict { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); font-size: var(--text-lg); line-height: 1.35; color: var(--color-ink); }
.eval-grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--space-8) var(--space-16); align-items: start; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--color-ink); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-4); align-items: center; min-height: 48px; padding-block: var(--space-2); border-bottom: 1px solid var(--color-rule); font-size: var(--text-sm); color: var(--color-ink-2); }
.row b { font-size: var(--text-md); font-weight: 700; color: var(--color-ink); white-space: nowrap; }
.row.key { color: var(--color-ink); font-weight: 500; }
.row.key b { font-family: var(--font-display); font-weight: 400; font-size: var(--text-lg); letter-spacing: -0.01em; }
.howto h3 { line-height: 1.3; }

/* term help */
.lgn { display: inline-flex; align-items: center; gap: var(--space-1); min-width: 0; }
.info { flex: none; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; background: none; font-size: 0; color: var(--color-muted); cursor: help; }
.info::before { content: "i"; display: grid; place-items: center; width: 16px; height: 16px; border: 1px solid currentColor; border-radius: 50%; font-family: var(--font-body); font-size: 11px; font-weight: 700; line-height: 1; transition: background-color var(--dur-micro), color var(--dur-micro), border-color var(--dur-micro); }
.info:hover, .info:focus-visible, .info[aria-expanded="true"] { color: var(--color-ink); }
.info:hover::before, .info[aria-expanded="true"]::before { background: var(--color-signal); border-color: var(--color-signal); color: var(--color-on-signal); }
.info:active::before { transform: scale(0.92); }
.tip { position: fixed; left: 0; top: 0; z-index: 40; max-width: min(300px, calc(100% - 32px)); padding: var(--space-3) var(--space-4); background: var(--color-ink); color: var(--color-paper); font-size: var(--text-sm); font-weight: 400; line-height: 1.45; border-radius: var(--radius); pointer-events: none; opacity: 0; transition: opacity var(--dur-micro); }
.tip.show { opacity: 1; }

/* sections */
.sec { display: flex; flex-direction: column; gap: var(--space-8); }
.sec-head { display: flex; flex-direction: column; gap: var(--space-3); }
.sec-head p { color: var(--color-ink-2); max-width: 68ch; }

.year { display: flex; height: 40px; border-radius: var(--radius); overflow: hidden; background: var(--color-paper-2); }
.yseg { flex: 0 0 0; background: var(--c); transition: flex-grow var(--dur-bar) var(--ease-out); box-shadow: inset -2px 0 0 var(--color-paper); min-width: 0; }
.yseg:last-child { box-shadow: none; }
.yseg.hatch { background-image: repeating-linear-gradient(135deg, transparent 0 5px, var(--color-paper) 5px 7px); }
.ylegend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-4) var(--space-6); margin-top: calc(var(--space-4) * -1); }
.yl { display: flex; flex-direction: column; gap: 2px; font-size: var(--text-xs); color: var(--color-muted); border-top: 4px solid var(--c); padding-top: var(--space-2); }
.yl b { font-size: var(--text-lg); color: var(--color-ink); font-weight: 700; }

/* the switchboard */
.board-top.solo { grid-template-columns: minmax(0, 1fr); }
.board-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-16); padding-block: var(--space-6); border-block: 1px solid var(--color-ink); }
.panel { display: flex; flex-direction: column; gap: var(--space-3); min-width: 0; color: var(--color-ink); }
.panel h3 { font-size: var(--text-sm); font-weight: 500; color: var(--color-muted); display: flex; }
.level-line { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.level-name { font-family: var(--font-display); font-size: var(--text-xl); letter-spacing: -0.01em; line-height: 1.1; }
.level-count { font-size: var(--text-sm); color: var(--color-muted); }
.meter { display: flex; gap: 2px; height: 8px; }
.meter i { flex: 1; background: var(--color-paper-3); border-radius: 1px; transition: background-color var(--dur-short) var(--ease-out); }
.meter i.on { background: var(--color-accent); color: var(--color-accent-ink); }

        todo.push(t('t_loss', { loss: eur2(-mval), y: eur0(-mval * r.bill) }));
      }
      todo.push(leftN ? t('t_left', { n: leftN }) : t('t_all'));
      $('e-todo-title').textContent = t(state === 'ok' ? 'e_means' : 'e_todo');
      $('e-todo').innerHTML = todo.map(function (x) { return '<li>' + x + '</li>'; }).join('');
    }

    // cards
    var S = st.salary, N = st.size, top = null;
    CATS.forEach(function (c) {
      catEl[c].firstChild.children[1].textContent = t('seg_' + c);
      tween(catEl[c].firstChild.children[2], r.h[c], function (v) { return '+' + eur2(v) + ' ' + t('per_h'); });
    });
    A.forEach(function (a) {
      var el = cardEl[a.id], on = !!st.on[a.id], imp = impact(a), v = annual(a, S, N, r.ag), basis;
      if (a.kind === 'fix') basis = t('b_year', { v: eur0(v) });
      else if (a.kind === 'shared') basis = t('b_shared', { t: eur0(a.total(N)), n: int(N) });
      else if (a.kind === 'salary') basis = t('b_salary', { p: pct(a.pct, 2) });
      else if (a.kind === 'raise') basis = t('b_raise', { p: pct(a.pct) });
      else basis = t('b_price', { p: pct(a.pct, 1) });
      el.setAttribute('aria-checked', on);
      el.querySelector('.card-name').textContent = t('a_' + a.id)[0];
      el.querySelector('.card-desc').textContent = t('a_' + a.id)[1];
      el.querySelector('.card-basis').textContent = basis;
      tween(el.querySelector('.card-imp'), imp, function (x) { return '+' + eur2(x) + ' ' + t('per_h'); });
      if (on && (!top || imp > top.imp)) top = { imp: imp, name: t('a_' + a.id)[0] };
    });

    // insights
    if (n >= 3) unlock('i1');
    if (n >= 10) unlock('i4');
    var base = compute({});
    var eff = 1 - r.cost / base.price - r.p;
    var lowU = compute(st.on, { util: Math.max(0.1, st.util - 0.1) });
    var dbl = compute(st.on, { size: st.size * 2 });
    var extras = r.h.work + r.h.people + r.h.org + r.h.risk;
    var body = {
      i1: eff >= 0 ? t('i1_p', { base: eur2(base.rate), m: pct(st.margin), eff: pct(eff, 1) }) : t('i1_n', { base: eur2(base.rate), loss: eur2(-eff * base.rate) }),
      i2: t('i2_p', { d: eur2(lowU.rate - r.rate), name: top ? top.name : t('a_office')[0], top: eur2(top ? top.imp : impact(A.filter(function (a) { return a.id === 'office'; })[0])) }),
      i3: t('i3_p', { n: int(st.size), a: eur2(r.shared / Math.max(0.05, 1 - st.margin - r.p)), b: eur2(dbl.shared / Math.max(0.05, 1 - st.margin - r.p)) }),
      i4: t(extras > r.h.social ? 'i4_p' : 'i4_p2', { n: n, a: eur2(extras), p: pct(extras / r.rate), s: eur2(r.h.social) })
    };
    INS.forEach(function (k) {
      var el = insEl[k], open = !!st.unlocked[k];
      el.classList.toggle('locked', !open); el.classList.toggle('open', open);
      el.children[0].textContent = t(open ? 'i_open' : 'i_locked');
      el.children[1].textContent = t(k + '_t');
      el.children[2].textContent = open ? body[k] : t(k + '_h');
      if (st.unlocked[k] === 'fresh') {
        st.unlocked[k] = true;
        el.classList.remove('fresh'); void el.offsetWidth; el.classList.add('fresh');
      }
    });

    first = false;
  }

  function applyLang() {
    document.documentElement.lang = st.lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $('lang-de').setAttribute('aria-pressed', st.lang === 'de'); $('lang-en').setAttribute('aria-pressed', st.lang === 'en');
    Array.prototype.forEach.call(document.querySelectorAll('.info'), function (b) { b.setAttribute('aria-label', t('tip_more')); b.setAttribute('aria-expanded', 'false'); });
    hideTip();
    // number tweens hold formatted text: reformat in place
    Array.prototype.forEach.call(document.querySelectorAll('.num'), function (el) { if (el._f && el._v !== undefined) { var v = el._v; el._v = undefined; tween(el, v, el._f); } });
    render();
  }

  /* ---------- term help ---------- */
  var tipEl = document.createElement('div'); tipEl.id = 'tip'; tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
  var tipFor = null;
  function showTip(b) {
    if (tipFor && tipFor !== b) hideTip();
    tipFor = b;
    tipEl.textContent = t('tip_' + b.getAttribute('data-tip'));
    b.setAttribute('aria-describedby', 'tip'); b.setAttribute('aria-expanded', 'true');
    var r = b.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight, vw = document.documentElement.clientWidth;
    var x = Math.max(16, Math.min(vw - w - 16, r.left + r.width / 2 - w / 2));
    var y = r.top - h - 6; if (y < 8) y = r.bottom + 6;
    tipEl.style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(y) + 'px)';
    tipEl.classList.add('show');
  }
  function hideTip() {
    if (!tipFor) return;
    tipFor.removeAttribute('aria-describedby'); tipFor.setAttribute('aria-expanded', 'false');
    tipFor = null; tipEl.classList.remove('show');
  }
  function infoOf(e) { return e.target && e.target.closest ? e.target.closest('.info') : null; }
  document.addEventListener('mouseover', function (e) { var b = infoOf(e); if (b) showTip(b); });
  document.addEventListener('mouseout', function (e) { if (infoOf(e)) hideTip(); });
  document.addEventListener('focusin', function (e) { var b = infoOf(e); if (b) showTip(b); });
  document.addEventListener('focusout', function (e) { if (infoOf(e)) hideTip(); });
  document.addEventListener('click', function (e) { var b = infoOf(e); if (b) showTip(b); else hideTip(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideTip(); });
  window.addEventListener('scroll', hideTip, { passive: true });

  /* ---------- wiring ---------- */
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  $('salary-r').addEventListener('input', function (e) { st.salary = +e.target.value; render(); });
  $('salary-n').addEventListener('input', function (e) { var v = +e.target.value; if (v >= 20000) { st.salary = clamp(v, 20000, 250000); render(); } });
  $('salary-n').addEventListener('blur', function (e) { e.target.value = st.salary; });
  function sizeChanged() { if (A.some(function (a) { return a.kind === 'shared' && st.on[a.id]; })) unlock('i3'); render(); }
  $('size-r').addEventListener('input', function (e) { st.size = +e.target.value; sizeChanged(); });
  $('size-n').addEventListener('input', function (e) { var v = Math.round(+e.target.value); if (v >= 2) { st.size = clamp(v, 2, 2000); sizeChanged(); } });
  $('size-n').addEventListener('blur', function (e) { e.target.value = st.size; });
  $('util-r').addEventListener('input', function (e) { st.util = +e.target.value / 100; unlock('i2'); render(); });
  $('margin-r').addEventListener('input', function (e) { st.margin = +e.target.value / 100; render(); });
  $('current').addEventListener('input', function (e) { var v = parseFloat(e.target.value); st.current = v > 0 ? clamp(v, 1, 1000) : null; render(); });
  $('pv-btn').addEventListener('click', function () { $('board').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); });
  $('all-on').addEventListener('click', function () { setAll(true); });
  $('all-off').addEventListener('click', function () { setAll(false); });
  function setMode(m) { st.mode = m; $('mode-abs').setAttribute('aria-pressed', m === 'abs'); $('mode-pct').setAttribute('aria-pressed', m === 'pct'); render(); }
  $('mode-abs').addEventListener('click', function () { setMode('abs'); });
  $('mode-pct').addEventListener('click', function () { setMode('pct'); });
  $('lang-de').addEventListener('click', function () { st.lang = 'de'; applyLang(); });
  $('lang-en').addEventListener('click', function () { st.lang = 'en'; applyLang(); });

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (es) {
      var e = es[0];
      $('dock').classList.toggle('show', !e.isIntersecting && e.boundingClientRect.top < 0);
    }, { threshold: 0 }).observe($('track'));
  }

  applyLang();
})();
</script>
